name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./maintenance   # 개편 중: 임시 페이지만 배포. 라이브 전환 시 '.'로 되돌리고 maintenance/ 삭제
          cname: recoculture.com
          exclude_assets: |
            docs/
            content/
            .github/
